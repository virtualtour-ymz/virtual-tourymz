<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تور مجازی دانشکده علوم‌پزشکی فردوس</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-container">
    <header>
      <h1>تور مجازی دانشکده فردوس</h1>
    </header>

    <main class="buttons-container">
      <div class="tour-button" onclick="openTour('pc-tour/index.html')">
        <div class="icon-wrapper">
          <img src="assets/pc-icon.svg" alt="کامپیوتر">
        </div>
        <h2>نسخه PC</h2>
      </div>

      <div class="tour-button" onclick="openTour('mobile-tour/index.html')">
        <div class="icon-wrapper">
          <img src="assets/mobile-icon.svg" alt="موبایل">
        </div>
        <h2>نسخه موبایل</h2>
      </div>
    </main>

    <footer>
      <p>توجه: در صورت کندی ، برای تجربه بهتر از فیلترشکن استفاده کنید</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
